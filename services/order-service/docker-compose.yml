version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders_db
    ports:
      - "5432:5432"
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./src/migrations/001_create_orders_table.sql:/docker-entrypoint-initdb.d/001_create_orders_table.sql:ro

  order-service:
    build: .
    ports:
      - "3001:3001"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: orders_db
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: us-east-1
      EVENT_BUS_NAME: orders-event-bus
    depends_on:
      - postgres

volumes:
  postgres-data: